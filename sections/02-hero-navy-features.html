<!-- 메인 특징 소개 v2 | 밝은 배경, 다른 페이지와 같은 머리글 톤 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
.es1{width:100%;background:#fff;padding:96px 6%;box-sizing:border-box;font-family:'Noto Sans KR',sans-serif;word-break:keep-all;}
.es1-in{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:4.5rem;align-items:center;}
.es1 h2{font-size:clamp(2.6rem,3.6vw,3.8rem);font-weight:800;line-height:1.3;letter-spacing:-.03em;color:#1a2d4a;margin:0 0 1.5rem;}
.es1 h2 .ac{color:#2f6b97;}
.es1-sub{font-size:17px;line-height:1.95;color:#4a5a6a;margin:0;max-width:480px;}
.es1-sub strong{color:#1a2d4a;font-weight:700;}
.es1-cards{display:flex;flex-direction:column;border-top:1px solid #d6e3ee;}
.es1-card{border-bottom:1px solid #d6e3ee;padding:1.5rem .5rem;display:grid;grid-template-columns:48px 1fr;align-items:flex-start;gap:18px;transition:background .25s;}
.es1-card:hover{background:#f7f9fb;}
.es1-ico{width:48px;height:48px;border-radius:50%;background:#e4eef7;display:flex;align-items:center;justify-content:center;color:#2f6b97;}
.es1-ct{font-size:19px;font-weight:800;color:#1a2d4a;margin:0 0 4px;letter-spacing:-.01em;line-height:1.4;}
.es1-cd{font-size:15.5px;color:#4a5a6a;line-height:1.7;margin:0;}
@media(max-width:900px){.es1-in{grid-template-columns:1fr;gap:2.5rem;}}
@media(max-width:480px){.es1{padding:64px 5%;}.es1-card{gap:14px;padding:1.3rem .25rem;}.es1-ico{width:42px;height:42px;}}
</style>
<div class="es1">
  <div class="es1-in">
    <div>
      <h2>성적, 기간, 행정까지<br>전부 챙기는<br><span class="ac">전문 담당자</span></h2>
      <p class="es1-sub">학위 취득, 대학 편입, 대학원 진학, 자격증 취득까지<br><strong>처음부터 끝까지</strong> 전담 담당자가 직접 관리합니다.<br>막히는 것 없이, 빠짐없이.</p>
    </div>
    <div class="es1-cards">
      <div class="es1-card">
        <div class="es1-ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg></div>
        <div><h3 class="es1-ct">프리미엄 타겟 컨설팅</h3><p class="es1-cd">수의대·약대 편입, 대학원 진학까지 설계</p></div>
      </div>
      <div class="es1-card">
        <div class="es1-ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><polyline points="17 11 19 13 23 9"></polyline></svg></div>
        <div><h3 class="es1-ct">끝까지 같은 담당자</h3><p class="es1-cd">중간에 바뀌지 않는 고정 1:1 케어</p></div>
      </div>
      <div class="es1-card">
        <div class="es1-ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg></div>
        <div><h3 class="es1-ct">투명한 학점 기준</h3><p class="es1-cd">상담 단계에서 미리 정확히 안내</p></div>
      </div>
      <div class="es1-card">
        <div class="es1-ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></div>
        <div><h3 class="es1-ct">검증된 후기만</h3><p class="es1-cd">실제 수강생의 솔직한 후기만 공개</p></div>
      </div>
    </div>
  </div>
</div>
