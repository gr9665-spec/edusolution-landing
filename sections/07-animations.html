<!-- 메인 페이지 애니메이션 v4 | 히어로 등장, 스크롤 등장(아래에서 살짝 올라옴), 네비 그림자, 부드러운 앵커 이동, 폼 입력 강조.
     "동작 줄이기" 설정이면 움직임 없이 바로 보인다. 실적 수치 띠의 숫자 카운트업은 그 조각 안에 따로 들어 있다. -->
<style>
@media (prefers-reduced-motion:no-preference){
  /* 히어로 */
  .esh h1 > *{display:inline-block;animation:heroUp 1.1s cubic-bezier(.16,1,.3,1) both;}
  .esh h1 .line2{animation-delay:.18s;}
  @keyframes heroUp{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:none;}}
  .esh-sub{animation:fadeInSub 1s .38s cubic-bezier(.16,1,.3,1) both;}
  .esh-btns{animation:fadeInSub .9s .58s cubic-bezier(.16,1,.3,1) both;}
  @keyframes fadeInSub{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}

  /* 스크롤 등장 */
  .es-rv{opacity:0;transform:translateY(18px);transition:opacity .75s cubic-bezier(.16,1,.3,1),transform .75s cubic-bezier(.16,1,.3,1);}
  .es-rv.es-in-view{opacity:1;transform:none;}

  /* 제출 버튼 idle 펄스 */
  @keyframes submitPulse{0%,100%{box-shadow:0 0 0 0 rgba(74,127,165,.4);}50%{box-shadow:0 0 0 10px rgba(74,127,165,0);}}
  #es6-submit-btn:not(:disabled){animation:submitPulse 2.8s 2s infinite;}
}

/* 폼 입력 강조 */
.es6-input:focus,.es6-select:focus{box-shadow:0 0 0 3px rgba(74,127,165,.2);transition:border-color .25s,background .25s,box-shadow .25s;}
</style>

<script>
(function(){
  var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function reveal(){
    if(calm || !('IntersectionObserver' in window)) return;
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(!e.isIntersecting) return;
        e.target.classList.add('es-in-view');
        io.unobserve(e.target);
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -30px 0px' });
    function reg(sel, step, mod){
      document.querySelectorAll(sel).forEach(function(el, i){
        el.classList.add('es-rv');
        if(step) el.style.transitionDelay = ((i % mod) * step) + 's';
        io.observe(el);
      });
    }
    reg('.es1 h2'); reg('.es1-sub'); reg('.es1-card', .1, 4);
    reg('.es3 h2'); reg('.es3-sub'); reg('.es3-item', .08, 3);
    reg('.esw-title'); reg('.esw-sub'); reg('.esw-card', .12, 2); reg('.esw-cta-wrap');
    reg('.es5 h2'); reg('.es5-head-sub'); reg('.es5-marq'); reg('.es5-cta-wrap');
    reg('.es6 h2'); reg('.es6-sub'); reg('#es6-form-body');
  }

  function initNav(){
    var nav = document.querySelector('.es0');
    if(!nav) return;
    window.addEventListener('scroll', function(){
      nav.style.boxShadow = window.scrollY > 60 ? '0 4px 28px rgba(14,31,61,.13)' : 'none';
      nav.style.background = window.scrollY > 60 ? 'rgba(255,255,255,.99)' : 'rgba(255,255,255,.96)';
    }, { passive:true });
  }

  function initSmoothScroll(){
    document.querySelectorAll('a[href^="#"]').forEach(function(a){
      a.addEventListener('click', function(e){
        var target = document.querySelector(this.getAttribute('href'));
        if(!target) return;
        e.preventDefault();
        window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - 80, behavior: calm ? 'auto' : 'smooth' });
        var mob = document.getElementById('es0mob');
        if(mob) mob.classList.remove('open');
      });
    });
  }

  function init(){ reveal(); initNav(); initSmoothScroll(); }
  if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', init); } else { init(); }
})();
</script>
