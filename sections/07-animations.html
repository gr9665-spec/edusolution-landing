<!-- =============================================
   에듀솔루션 | 애니메이션 전용 코드 v3
   ※ 기존 애니메이션 코드 위젯 삭제 후 교체
   ※ 페이지 최하단에 추가
   ※ 섹션 배경·패딩 모두 0
================================================ -->
<style>

/* ── 1. 히어로 타이틀 ── */
.esh h1 > *{
  display:inline-block;
  animation:heroUp 1.1s cubic-bezier(.16,1,.3,1) both;
}
.esh h1 .line2{ animation-delay:.18s; }
@keyframes heroUp{
  from{ opacity:0; transform:translateY(50px); }
  to{   opacity:1; transform:none; }
}
.esh-sub{
  animation:fadeInSub 1s .38s cubic-bezier(.16,1,.3,1) both;
}
.esh-btns{
  animation:fadeInSub .9s .58s cubic-bezier(.16,1,.3,1) both;
}
@keyframes fadeInSub{
  from{ opacity:0; transform:translateY(16px); }
  to{   opacity:1; transform:none; }
}

/* ── 2. 스크롤 트리거 공통 ── */
.scroll-hidden{
  opacity:0;
  transform:translateY(22px);
  transition:
    opacity   .95s cubic-bezier(.16,1,.3,1),
    transform .95s cubic-bezier(.16,1,.3,1);
}
.scroll-show{
  opacity:1 !important;
  transform:none !important;
}

/* ── 3. 섹션1 카드 ── */
.es1-card{
  transition:background .3s, transform .3s, box-shadow .3s,
             opacity .9s cubic-bezier(.16,1,.3,1);
}
.es1-card.scroll-hidden{ opacity:0; transform:translateY(22px); }
.es1-card.scroll-show:nth-child(1){ transition-delay:.0s; }
.es1-card.scroll-show:nth-child(2){ transition-delay:.12s; }
.es1-card.scroll-show:nth-child(3){ transition-delay:.24s; }
.es1-card.scroll-show:nth-child(4){ transition-delay:.36s; }
.es1-card:hover{ box-shadow:0 8px 32px rgba(74,127,165,.28); }

/* ── 4. 섹션2 stat ── */
.es2-item{
  transition:opacity .9s cubic-bezier(.16,1,.3,1),
             transform .9s cubic-bezier(.16,1,.3,1),
             background .2s;
}
.es2-item.scroll-hidden{ opacity:0; transform:translateY(14px); }
.es2-item.scroll-show:nth-child(1){ transition-delay:.0s; }
.es2-item.scroll-show:nth-child(2){ transition-delay:.12s; }
.es2-item.scroll-show:nth-child(3){ transition-delay:.24s; }
.es2-item.scroll-show:nth-child(4){ transition-delay:.36s; }

/* ── 5. 섹션3 카드 ── */
.es3-item{
  transition:opacity .9s cubic-bezier(.16,1,.3,1),
             transform .9s cubic-bezier(.16,1,.3,1),
             background .3s;
}
.es3-item.scroll-hidden{ opacity:0; transform:translateY(20px); }
.es3-item.scroll-show:nth-child(1){ transition-delay:.0s;  }
.es3-item.scroll-show:nth-child(2){ transition-delay:.12s; }
.es3-item.scroll-show:nth-child(3){ transition-delay:.24s; }
.es3-item.scroll-show:nth-child(4){ transition-delay:.36s; }
.es3-item.scroll-show:nth-child(5){ transition-delay:.48s; }
.es3-item.scroll-show:nth-child(6){ transition-delay:.60s; }

/* ── 6. 섹션4 스텝 ── */
.es4-step{
  transition:opacity .9s cubic-bezier(.16,1,.3,1),
             transform .9s cubic-bezier(.16,1,.3,1);
}
.es4-step.scroll-hidden{ opacity:0; transform:translateY(18px); }
.es4-step.scroll-show:nth-child(1){ transition-delay:.0s;  }
.es4-step.scroll-show:nth-child(2){ transition-delay:.14s; }
.es4-step.scroll-show:nth-child(3){ transition-delay:.28s; }
.es4-step.scroll-show:nth-child(4){ transition-delay:.42s; }
.es4-step.scroll-show:nth-child(5){ transition-delay:.56s; }

/* ── 7. 섹션5 카드 ── */
.es5-card{
  transition:opacity .9s cubic-bezier(.16,1,.3,1),
             transform .9s cubic-bezier(.16,1,.3,1),
             border-color .3s, box-shadow .3s;
}
.es5-card.scroll-hidden{ opacity:0; transform:translateY(20px); }
.es5-card.scroll-show:nth-child(1){ transition-delay:.0s;  }
.es5-card.scroll-show:nth-child(2){ transition-delay:.12s; }
.es5-card.scroll-show:nth-child(3){ transition-delay:.24s; }
.es5-card.scroll-show:nth-child(4){ transition-delay:.36s; }
.es5-card.scroll-show:nth-child(5){ transition-delay:.48s; }
.es5-card.scroll-show:nth-child(6){ transition-delay:.60s; }

/* ── 8. 폼 인풋 마이크로 ── */
.es6-input:focus,
.es6-select:focus{
  box-shadow:0 0 0 3px rgba(74,127,165,.2);
  transform:translateY(-1px);
  transition:border-color .25s, background .25s,
             box-shadow .25s, transform .25s;
}

/* ── 9. 제출 버튼 idle 펄스 ── */
@keyframes submitPulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(74,127,165,.4); }
  50%{     box-shadow:0 0 0 10px rgba(74,127,165,0); }
}
#es6-submit-btn:not(:disabled){
  animation:submitPulse 2.8s 2s infinite;
}

/* ── 10. 배지 등장 ── */
.es1-badge{
  animation:badgePop .8s .2s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes badgePop{
  from{ opacity:0; transform:scale(.82); }
  to{   opacity:1; transform:scale(1); }
}

</style>

<script>
(function(){

  /* ── IntersectionObserver ── */
  /* rootMargin 넉넉하게 → 요소가 화면에 들어올 때 여유있게 트리거 */
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      e.target.classList.remove('scroll-hidden');
      e.target.classList.add('scroll-show');
      io.unobserve(e.target);
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -20px 0px' });

  function registerScroll(sel){
    document.querySelectorAll(sel).forEach(function(el){
      el.classList.add('scroll-hidden');
      io.observe(el);
    });
  }

  function registerText(sel, delay){
    document.querySelectorAll(sel).forEach(function(el){
      el.classList.add('scroll-hidden');
      el.style.transitionDelay = (delay || 0) + 's';
      io.observe(el);
    });
  }

  /* ── 숫자 카운터 ── */
  function countUp(el, target, duration){
    var isFloat = String(target).indexOf('.') !== -1;
    var startTime = null;
    function step(ts){
      if(!startTime) startTime = ts;
      var p = Math.min((ts - startTime) / duration, 1);
      var ease = 1 - Math.pow(1 - p, 4);
      var val = ease * target;
      el.textContent = isFloat
        ? val.toFixed(1)
        : Math.floor(val).toLocaleString();
      if(p < 1) requestAnimationFrame(step);
      else el.textContent = isFloat ? target.toFixed(1) : Number(target).toLocaleString();
    }
    requestAnimationFrame(step);
  }

  var statsObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      var el = e.target;
      countUp(el, parseFloat(el.getAttribute('data-count')), 2000);
      statsObserver.unobserve(el);
    });
  }, { threshold: 0.5 });

  function initStats(){
    var map = [
      { sel:'.es2-in .es2-item:nth-child(1) .es2-main', count:'28000' },
      { sel:'.es2-in .es2-item:nth-child(2) .es2-main', count:'99.9' },
    ];
    map.forEach(function(m){
      var el = document.querySelector(m.sel);
      if(!el) return;
      el.setAttribute('data-count', m.count);
      statsObserver.observe(el);
    });
  }

  /* ── 네비 스크롤 그림자 ── */
  function initNav(){
    var nav = document.querySelector('.es0');
    if(!nav) return;
    window.addEventListener('scroll', function(){
      nav.style.boxShadow = window.scrollY > 60
        ? '0 4px 28px rgba(14,31,61,.13)'
        : 'none';
      nav.style.background = window.scrollY > 60
        ? 'rgba(255,255,255,.99)'
        : 'rgba(255,255,255,.96)';
    }, { passive:true });
  }

  /* ── 부드러운 앵커 스크롤 ── */
  function initSmoothScroll(){
    document.querySelectorAll('a[href^="#"]').forEach(function(a){
      a.addEventListener('click', function(e){
        var target = document.querySelector(this.getAttribute('href'));
        if(!target) return;
        e.preventDefault();
        window.scrollTo({
          top: target.getBoundingClientRect().top + window.scrollY - 80,
          behavior: 'smooth'
        });
        var mob = document.getElementById('es0mob');
        if(mob) mob.classList.remove('open');
      });
    });
  }

  /* ── 섹션3 카드 3D 틸트 (데스크탑) ── */
  function initTilt(){
    if(window.innerWidth < 768) return;
    document.querySelectorAll('.es3-item').forEach(function(card){
      card.addEventListener('mousemove', function(e){
        var r = card.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width  - 0.5;
        var y = (e.clientY - r.top)  / r.height - 0.5;
        card.style.transform =
          'translateY(-3px) rotateX('+(-y*4)+'deg) rotateY('+(x*4)+'deg)';
        card.style.transition = 'transform .12s';
      });
      card.addEventListener('mouseleave', function(){
        card.style.transform = '';
        card.style.transition = 'transform .6s cubic-bezier(.16,1,.3,1)';
      });
    });
  }

  /* ── 전체 초기화 ── */
  function init(){
    registerScroll('.es1-card');
    registerScroll('.es2-item');
    registerScroll('.es3-item');
    registerScroll('.es4-step');
    registerScroll('.es5-card');

    /* 헤딩 */
    registerText('.es1 h1',  0);
    registerText('.es3 h2',  0);
    registerText('.es4 h2',  0);
    registerText('.es5 h2',  0);
    registerText('.es6 h2',  0);

    /* 서브텍스트 - 헤딩보다 0.15s 뒤 */
    registerText('.es1-sub',  0.15);
    registerText('.es3-sub',  0.15);
    registerText('.es4-sub',  0.15);
    registerText('.es5-cta',  0.15);
    registerText('.es6-sub',  0.15);

    /* 라벨 */
    registerText('.es3-label', 0);
    registerText('.es4-label', 0);
    registerText('.es5-label', 0);
    registerText('.es6-lbl',   0);

    /* 기타 */
    registerText('.es4-note',       0.6);
    registerText('#es6-form-body',  0.12);

    initStats();
    initNav();
    initSmoothScroll();
    initTilt();
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
