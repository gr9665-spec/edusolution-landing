<!-- 섹션5 수강생 후기 v6 | 최신 후기 카드가 천천히 흐르는 띠 (데이터: data/reviews*.json, 렌더링: site_build/render.py reviews_marquee) -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
.es5{width:100%;background:#f4f7fb;padding:96px 6%;word-break:keep-all;box-sizing:border-box;font-family:'Noto Sans KR',sans-serif;}
.es5-in{max-width:1100px;margin:0 auto;}
.es5-head{text-align:center;margin-bottom:.75rem;}
.es5 h2{font-size:clamp(2.6rem,3.4vw,3.4rem);font-weight:800;letter-spacing:-.03em;line-height:1.3;color:#1a2d4a;margin:0 0 1rem;}
.es5-head-sub{font-size:17px;line-height:1.85;color:#4a5a6a;margin:0 0 2.5rem;text-align:center;}

/* 흐르는 후기 띠: 4개 이상이면 is-flow(자동으로 흐름), 그보다 적으면 is-static(가만히) */
.es5-marq{position:relative;overflow:hidden;padding:14px 0 26px;}
.es5-marq.is-flow{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 5%,#000 95%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 5%,#000 95%,transparent 100%);}
.es5-track{display:flex;width:max-content;animation:es5-flow var(--dur,60s) linear infinite;will-change:transform;}
.es5-set{display:flex;flex-shrink:0;}
@keyframes es5-flow{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.es5-marq:hover .es5-track,.es5-marq:focus-within .es5-track{animation-play-state:paused;}

.es5-card{display:flex;flex-direction:column;flex:0 0 280px;width:280px;margin-right:22px;background:#fff;border-radius:18px;border:1px solid rgba(74,127,165,.1);overflow:hidden;color:inherit;text-decoration:none;transition:border-color .3s,transform .3s,box-shadow .3s;}
.es5-card:hover,.es5-card:focus-visible{border-color:rgba(74,127,165,.3);transform:translateY(-6px);box-shadow:0 20px 56px rgba(74,127,165,.14);}
.es5-img{display:block;aspect-ratio:16/10;background:#1a2d4a;overflow:hidden;}
.es5-img img{display:block;width:100%;height:100%;object-fit:cover;}
.es5-body{display:flex;flex-direction:column;flex:1;padding:1.1rem 1.25rem 1.2rem;}
.es5-ttl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:17px;font-weight:900;line-height:1.45;letter-spacing:-.02em;color:#1a2d4a;margin:0 0 .45rem;}
.es5-sub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.7;color:#6b7f93;margin:0 0 auto;padding-bottom:.9rem;}
.es5-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:#8a9ab0;}
.es5-cat{background:#eef3f8;color:#4a7fa5;font-size:12px;font-weight:700;padding:5px 11px;border-radius:7px;white-space:nowrap;}

.es5-marq.is-static .es5-set{flex-wrap:wrap;justify-content:center;width:100%;}
.es5-marq.is-static .es5-card{margin:0 11px 22px;}

/* 동작 줄이기를 켰거나 터치 화면이면 자동으로 흐르지 않고 손가락으로 넘긴다 */
@media (prefers-reduced-motion:reduce),(pointer:coarse){
  .es5-marq.is-flow{overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;-webkit-mask-image:none;mask-image:none;}
  .es5-marq.is-flow .es5-track{animation:none;}
  .es5-marq.is-flow .es5-set[data-clone]{display:none;}
  .es5-marq.is-flow .es5-card{scroll-snap-align:start;}
}

.es5-cta-wrap{text-align:center;margin-top:2rem;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;}
.es5-cta{display:inline-block;background:#4a7fa5;color:#fff !important;padding:18px 48px;border-radius:10px;font-size:17px;font-weight:700;text-decoration:none;transition:background .2s,transform .15s;}
.es5-cta:hover{background:#1a2d4a;transform:translateY(-2px);}
.es5-cta-sub{display:inline-block;background:#fff;color:#4a7fa5 !important;padding:16px 48px;border-radius:10px;font-size:17px;font-weight:700;text-decoration:none;border:2px solid #4a7fa5;box-sizing:border-box;transition:background .2s,transform .15s;}
.es5-cta-sub:hover{background:#ddeaf4;transform:translateY(-2px);}
@media(max-width:540px){.es5{padding:60px 5%;}.es5-card{flex-basis:250px;width:250px;margin-right:16px;}}
</style>
<div class="es5" id="es-reviews">
  <div class="es5-in">
    <div class="es5-head">
      <h2>실제 수강생들의<br>솔직한 후기</h2>
    </div>
    <p class="es5-head-sub">팀 에듀솔루션과 함께 과정을 성공했어요!</p>
    {{reviews_marquee}}
    <div class="es5-cta-wrap">
      <a href="/pages/reviews/" class="es5-cta-sub">후기 더보기</a>
      <a href="#es-form" class="es5-cta">나도 무료 상담받기 →</a>
    </div>
  </div>
</div>
