<!-- 섹션5 수강생 후기 v5 | 아임웹 코드 위젯에 붙여넣기 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
.es5{width:100%;background:#f4f7fb;padding:100px 6%;box-sizing:border-box;font-family:'Noto Sans KR',sans-serif;}
.es5-in{max-width:1100px;margin:0 auto;}
.es5-label{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#4a7fa5;margin-bottom:1rem;display:flex;align-items:center;justify-content:center;gap:8px;}
.es5-label::before,.es5-label::after{content:'';display:block;width:28px;height:2px;background:#4a7fa5;border-radius:2px;}
.es5-head{text-align:center;margin-bottom:.75rem;}
.es5 h2{font-size:clamp(2.2rem,4vw,3.6rem);font-weight:900;letter-spacing:-.04em;line-height:1.2;color:#1a2d4a;margin:0 0 1rem;}
.es5 h2 em{font-family:'Playfair Display',serif;font-style:italic;color:#4a7fa5;}
.es5-head-sub{font-size:clamp(15px,1.7vw,18px);color:#7a8fa5;margin:0 0 3.5rem;text-align:center;}
.es5-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.75rem;}
.es5-card{background:#fff;border-radius:22px;padding:2.5rem 2.5rem 2rem;border:1px solid rgba(74,127,165,.1);position:relative;overflow:hidden;transition:border-color .3s,transform .3s,box-shadow .3s;display:flex;flex-direction:column;}
.es5-card:hover{border-color:rgba(74,127,165,.3);transform:translateY(-6px);box-shadow:0 20px 56px rgba(74,127,165,.12);}
.es5-quote-bg{position:absolute;top:-18px;left:16px;font-family:'Playfair Display',serif;font-size:200px;line-height:1;color:rgba(74,127,165,.06);pointer-events:none;user-select:none;}
.es5-stars{display:flex;gap:4px;margin-bottom:1.4rem;position:relative;z-index:1;}
.es5-star{width:20px;height:20px;background:#f5a623;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);flex-shrink:0;}
.es5-headline{font-size:clamp(16px,1.8vw,20px);font-weight:900;color:#1a2d4a;line-height:1.5;margin:0 0 1.25rem;position:relative;z-index:1;letter-spacing:-.02em;}
.es5-headline mark{background:none;color:#4a7fa5;}
.es5-text{font-size:clamp(14px,1.5vw,15px);line-height:2;color:#4a5a6a;margin:0 0 auto;position:relative;z-index:1;padding-bottom:1.75rem;}
.es5-text strong{color:#1a2d4a;font-weight:700;}
.es5-div{height:1px;background:rgba(74,127,165,.1);margin-bottom:1.5rem;}
.es5-foot{display:flex;align-items:center;gap:14px;position:relative;z-index:1;}
.es5-av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#ddeaf4,#b8d4ea);color:#1a2d4a;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;flex-shrink:0;border:2px solid rgba(74,127,165,.2);}
.es5-name{font-size:16px;font-weight:700;color:#1a2d4a;margin:0 0 3px;}
.es5-meta{font-size:13px;color:#8a9ab0;margin:0;}
.es5-badge{margin-left:auto;flex-shrink:0;background:#1a2d4a;color:#a0cde0;font-size:12px;font-weight:700;padding:6px 13px;border-radius:7px;white-space:nowrap;}
.es5-cta-wrap{text-align:center;margin-top:3rem;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;}
.es5-cta{display:inline-block;background:#4a7fa5;color:#fff !important;padding:18px 48px;border-radius:10px;font-size:17px;font-weight:700;text-decoration:none;transition:background .2s,transform .15s;}
.es5-cta:hover{background:#1a2d4a;transform:translateY(-2px);}
.es5-cta-sub{display:inline-block;background:#fff;color:#4a7fa5 !important;padding:16px 48px;border-radius:10px;font-size:17px;font-weight:700;text-decoration:none;border:2px solid #4a7fa5;box-sizing:border-box;transition:background .2s,transform .15s;}
.es5-cta-sub:hover{background:#ddeaf4;transform:translateY(-2px);}
@media(max-width:900px){.es5-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:540px){.es5-grid{grid-template-columns:1fr;}.es5{padding:60px 5%;}}
</style>
<div class="es5" id="es-reviews">
  <div class="es5-in">
    <div class="es5-label">Our Review</div>
    <div class="es5-head">
      <h2>실제 수강생들의<br><em>솔직한 후기</em></h2>
    </div>
    <p class="es5-head-sub">팀 에듀솔루션과 함께 과정을 성공했어요!</p>
    <div class="es5-grid">{{reviews_featured}}</div>
    <div class="es5-cta-wrap">
      <a href="/pages/reviews/" class="es5-cta-sub">후기 더보기</a>
      <a href="#es-form" class="es5-cta">나도 무료 상담받기 →</a>
    </div>
  </div>
</div>
