<!-- 수강생 후기 페이지 | 스크롤 등장 + 분류 필터. 동작 줄이기 설정이면 움직임 없이 바로 보임 -->
<style>
@media (prefers-reduced-motion:no-preference){
  .pr-rv{opacity:0;transform:translateY(18px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1),border-color .3s,box-shadow .3s;}
  .pr-rv.pr-in-view{opacity:1;transform:none;}
  .pr-card.pr-rv.pr-in-view:hover{transform:translateY(-6px);}
}
</style>
<script>
(function(){
  /* 분류 필터 + 페이지 넘김: 칩을 누르면 data-cat이 맞는 카드만 남고(pr-hide),
     남은 카드는 두 줄씩 나눠 보여준다(pr-off). 한 줄 카드 수는 화면 폭에 따라 달라서 실제 열 수를 읽어 계산한다.
     모든 카드는 HTML에 그대로 있어 자바스크립트가 꺼져도 전부 보이고, 보던 페이지는 ?p= 로 주소에 남는다. */
  function initFilter(){
    var chips = document.querySelectorAll('#pr-filter .pr-chip');
    var grid = document.getElementById('pr-grid');
    var nav = document.getElementById('pr-pager');
    var cards = [].slice.call(document.querySelectorAll('#pr-grid .pr-card'));
    var filter = 'all';
    var page = 1;
    var m = /[?&]p=(\d+)/.exec(location.search);
    if (m) page = parseInt(m[1], 10) || 1;

    function matches(card){
      var cats = (card.getAttribute('data-cat') || '').split(' ');
      return filter === 'all' || cats.indexOf(filter) !== -1;
    }
    function perPage(){
      var cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length || 1;
      return Math.max(cols * 2, 4);
    }
    function btn(label, target, extra, aria){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pr-pg' + (extra ? ' ' + extra : '');
      b.textContent = label;
      if (aria) b.setAttribute('aria-label', aria);
      if (target) b.addEventListener('click', function(){ show(target, true); });
      else b.disabled = true;
      return b;
    }
    function render(){
      var list = cards.filter(matches);
      var per = perPage();
      var pages = Math.max(1, Math.ceil(list.length / per));
      page = Math.min(Math.max(page, 1), pages);
      cards.forEach(function(card){ card.classList.toggle('pr-hide', !matches(card)); card.classList.remove('pr-off'); });
      list.forEach(function(card, i){ card.classList.toggle('pr-off', Math.floor(i / per) + 1 !== page); });
      nav.textContent = '';
      if (pages < 2) return;
      nav.appendChild(btn('‹ 이전', page > 1 ? page - 1 : 0, 'pr-pg-side', '이전 페이지'));
      for (var p = 1; p <= pages; p++){
        var b = btn(String(p), p === page ? 0 : p, p === page ? 'on' : '', p + '페이지');
        if (p === page){ b.disabled = false; b.setAttribute('aria-current', 'page'); }
        nav.appendChild(b);
      }
      nav.appendChild(btn('다음 ›', page < pages ? page + 1 : 0, 'pr-pg-side', '다음 페이지'));
    }
    function remember(){
      var url = location.pathname + (filter === 'all' && page > 1 ? '?p=' + page : '') + location.hash;
      history.replaceState(null, '', url);
    }
    function show(target, scroll){
      page = target;
      render();
      remember();
      if (scroll) window.scrollTo({ top: grid.getBoundingClientRect().top + window.scrollY - 180, behavior: 'smooth' });
    }

    chips.forEach(function(chip){
      chip.addEventListener('click', function(){
        filter = chip.getAttribute('data-filter');
        chips.forEach(function(c){ c.classList.remove('on'); });
        chip.classList.add('on');
        page = 1;
        render();
        remember();
      });
    });
    var timer;
    window.addEventListener('resize', function(){ clearTimeout(timer); timer = setTimeout(function(){ render(); remember(); }, 150); });
    render();
  }

  function reveal(){
    if(!('IntersectionObserver' in window) || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(!e.isIntersecting) return;
        e.target.classList.add('pr-in-view');
        io.unobserve(e.target);
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });
    function reg(sel, step, mod){
      document.querySelectorAll(sel).forEach(function(el, i){
        el.classList.add('pr-rv');
        if(step) el.style.transitionDelay = ((i % mod) * step) + 's';
        io.observe(el);
      });
    }
    reg('.pr-h2'); reg('.pr-lead');
    reg('.pr-card', .08, 4);
    reg('.pr-why-item', .1, 4);
    reg('.pr-cta h2'); reg('.pr-cta p'); reg('.pr-cta-btn');
  }

  function smoothAnchors(){
    document.querySelectorAll('a[href^="#"]').forEach(function(a){
      a.addEventListener('click', function(e){
        var target = document.querySelector(this.getAttribute('href'));
        if(!target) return;
        e.preventDefault();
        window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' });
      });
    });
  }

  function init(){ initFilter(); reveal(); smoothAnchors(); }
  if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', init); } else { init(); }
})();
</script>
