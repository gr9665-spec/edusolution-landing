<!-- 학점은행제 페이지 | 스크롤 등장(아래에서 살짝 올라오며 나타남) + 부드러운 앵커 이동. 동작 줄이기 설정이면 움직임 없이 바로 보임 -->
<style>
@media (prefers-reduced-motion:no-preference){
  .pk-rv{opacity:0;transform:translateY(18px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);}
  .pk-rv.pk-in-view{opacity:1;transform:none;}
}
</style>
<script>
(function(){
  if(!('IntersectionObserver' in window) || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;

  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      e.target.classList.add('pk-in-view');
      io.unobserve(e.target);
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -30px 0px' });

  function reveal(sel, step){
    document.querySelectorAll(sel).forEach(function(el, i){
      el.classList.add('pk-rv');
      if(step) el.style.transitionDelay = ((i % 6) * step) + 's';
      io.observe(el);
    });
  }

  function init(){
    reveal('.pk-sec .pk-h2');
    reveal('.pk-sec .pk-lead');
    reveal('.pk-fs', .1);
    reveal('.pk-note');
    reveal('.pk-goal', .06);
    reveal('.pk-tl li', .1);
    reveal('.pk-faq details', .06);
    reveal('.pk-cta h2');
    reveal('.pk-cta p');
    reveal('.pk-cta-btn');

    document.querySelectorAll('a[href^="#"]').forEach(function(a){
      a.addEventListener('click', function(e){
        var target = document.querySelector(this.getAttribute('href'));
        if(!target) return;
        e.preventDefault();
        window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' });
      });
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
