<!-- =============================================
   에듀솔루션 | 교육정보 페이지 애니메이션
   ※ 교육정보 페이지 최하단에 추가
   ※ 섹션 배경·패딩 모두 0
================================================ -->
<style>

/* ── 1. 히어로 ── */
.pe-hero-lbl{
  animation:badgePop .8s .1s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes badgePop{
  from{ opacity:0; transform:scale(.82); }
  to{   opacity:1; transform:scale(1); }
}
.pe-hero h1{
  animation:heroUp 1.1s .22s cubic-bezier(.16,1,.3,1) both;
}
@keyframes heroUp{
  from{ opacity:0; transform:translateY(40px); }
  to{   opacity:1; transform:none; }
}
.pe-hero-sub{
  animation:fadeUp .95s .42s cubic-bezier(.16,1,.3,1) both;
}
@keyframes fadeUp{
  from{ opacity:0; transform:translateY(18px); }
  to{   opacity:1; transform:none; }
}

/* ── 2. 스크롤 트리거 공통 ── */
.scroll-hidden{
  opacity:0;
  transform:translateY(22px);
  transition:
    opacity   .95s cubic-bezier(.16,1,.3,1),
    transform .95s cubic-bezier(.16,1,.3,1);
}
.scroll-show{
  opacity:1 !important;
  transform:none !important;
}

/* ── 3. 라벨·타이틀·설명 ── */
.pe-lbl{
  transition:opacity .85s cubic-bezier(.16,1,.3,1),
             transform .85s cubic-bezier(.16,1,.3,1);
}
.pe-sec-title{
  transition:opacity .95s .1s cubic-bezier(.16,1,.3,1),
             transform .95s .1s cubic-bezier(.16,1,.3,1);
}
.pe-sec-sub{
  transition:opacity .9s .2s cubic-bezier(.16,1,.3,1),
             transform .9s .2s cubic-bezier(.16,1,.3,1);
}

/* ── 4. 카드 스태거 ── */
.pe-card{
  transition:opacity .9s cubic-bezier(.16,1,.3,1),
             transform .9s cubic-bezier(.16,1,.3,1),
             box-shadow .3s, transform .3s;
}
.pe-card.scroll-hidden{ opacity:0; transform:translateY(28px); }
.pe-card.scroll-show:nth-of-type(1){ transition-delay:.0s;  }
.pe-card.scroll-show:nth-of-type(2){ transition-delay:.1s;  }
.pe-card.scroll-show:nth-of-type(3){ transition-delay:.2s;  }
.pe-card.scroll-show:nth-of-type(4){ transition-delay:.3s;  }
.pe-card.scroll-show:nth-of-type(5){ transition-delay:.4s;  }
.pe-card.scroll-show:nth-of-type(6){ transition-delay:.5s;  }

/* ── 5. 카드 내부 요소 (인포 블록 · 스텝 · 포인트) ── */
.pe-info{
  transition:opacity .8s cubic-bezier(.16,1,.3,1),
             transform .8s cubic-bezier(.16,1,.3,1);
}
.pe-info.inner-hidden{ opacity:0; transform:translateY(12px); }
.pe-info.inner-show{ opacity:1; transform:none; }

.pe-step{
  transition:opacity .7s cubic-bezier(.16,1,.3,1),
             transform .7s cubic-bezier(.16,1,.3,1);
}
.pe-step.inner-hidden{ opacity:0; transform:translateX(-10px); }
.pe-step.inner-show{ opacity:1; transform:none; }

.pe-point{
  transition:opacity .8s cubic-bezier(.16,1,.3,1),
             transform .8s cubic-bezier(.16,1,.3,1);
}
.pe-point.inner-hidden{ opacity:0; transform:translateY(10px); }
.pe-point.inner-show{ opacity:1; transform:none; }

/* ── 6. CTA ── */
.pe-cta-title{
  transition:opacity .95s cubic-bezier(.16,1,.3,1),
             transform .95s cubic-bezier(.16,1,.3,1);
}
.pe-cta-sub{
  transition:opacity .9s .14s cubic-bezier(.16,1,.3,1),
             transform .9s .14s cubic-bezier(.16,1,.3,1);
}
.pe-cta-btn{
  transition:opacity .85s .28s cubic-bezier(.16,1,.3,1),
             transform .85s .28s cubic-bezier(.16,1,.3,1),
             background .2s, transform .15s;
}

</style>

<script>
(function(){

  /* ── IntersectionObserver ── */
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      e.target.classList.remove('scroll-hidden');
      e.target.classList.add('scroll-show');
      io.unobserve(e.target);
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -20px 0px' });

  function reg(sel){
    document.querySelectorAll(sel).forEach(function(el){
      el.classList.add('scroll-hidden');
      io.observe(el);
    });
  }

  function regDelay(sel, delay){
    document.querySelectorAll(sel).forEach(function(el){
      el.classList.add('scroll-hidden');
      el.style.transitionDelay = delay + 's';
      io.observe(el);
    });
  }

  /* ── 카드 내부 요소(인포/스텝/포인트) 순차 등장 ── */
  var innerIO = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      e.target.classList.remove('inner-hidden');
      e.target.classList.add('inner-show');
      innerIO.unobserve(e.target);
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -10px 0px' });

  function initCardInner(){
    document.querySelectorAll('.pe-card').forEach(function(card){
      var children = card.querySelectorAll('.pe-info, .pe-step, .pe-point');
      children.forEach(function(el, i){
        el.classList.add('inner-hidden');
        el.style.transitionDelay = (i * 0.06) + 's';
        innerIO.observe(el);
      });
    });
  }

  /* ── 부드러운 앵커 스크롤 ── */
  function initSmoothScroll(){
    document.querySelectorAll('a[href^="#"]').forEach(function(a){
      a.addEventListener('click', function(e){
        var target = document.querySelector(this.getAttribute('href'));
        if(!target) return;
        e.preventDefault();
        window.scrollTo({
          top: target.getBoundingClientRect().top + window.scrollY - 80,
          behavior: 'smooth'
        });
      });
    });
  }

  /* ── 전체 초기화 ── */
  function init(){

    /* 라벨·타이틀·설명 */
    reg('.pe-lbl');
    reg('.pe-sec-title');
    reg('.pe-sec-sub');

    /* 카드 */
    reg('.pe-card');

    /* 카드 내부 요소 순차 등장 */
    initCardInner();

    /* CTA */
    reg('.pe-cta-title');
    reg('.pe-cta-sub');
    reg('.pe-cta-btn');

    /* 앵커 스크롤 */
    initSmoothScroll();
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
