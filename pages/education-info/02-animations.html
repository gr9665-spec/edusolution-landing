<!-- 교육정보 페이지 | 스크롤 등장 + 부드러운 앵커 이동 + 주소의 #항목(예: #grad)으로 들어오면 그 목표를 펼침. 동작 줄이기 설정이면 움직임 없음 -->
<style>
@media (prefers-reduced-motion:no-preference){
  .pe-rv{opacity:0;transform:translateY(18px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);}
  .pe-rv.pe-in-view{opacity:1;transform:none;}
}
</style>
<script>
(function(){
  function openFromHash(){
    var id = (location.hash || '').replace('#','');
    if(!id) return;
    var el = document.getElementById(id);
    if(el && el.tagName === 'DETAILS'){
      el.open = true;
      setTimeout(function(){ window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 90 }); }, 50);
    }
  }

  function smoothAnchors(){
    document.querySelectorAll('a[href^="#"]').forEach(function(a){
      a.addEventListener('click', function(e){
        var target = document.querySelector(this.getAttribute('href'));
        if(!target) return;
        e.preventDefault();
        window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' });
      });
    });
  }

  function reveal(){
    if(!('IntersectionObserver' in window) || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(!e.isIntersecting) return;
        e.target.classList.add('pe-in-view');
        io.unobserve(e.target);
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -30px 0px' });
    function reg(sel, step){
      document.querySelectorAll(sel).forEach(function(el, i){
        el.classList.add('pe-rv');
        if(step) el.style.transitionDelay = ((i % 6) * step) + 's';
        io.observe(el);
      });
    }
    reg('.pe-h2'); reg('.pe-lead'); reg('.pe-item', .06);
    reg('.pe-cta h2'); reg('.pe-cta p'); reg('.pe-cta-btn');
  }

  function init(){ reveal(); smoothAnchors(); openFromHash(); window.addEventListener('hashchange', openFromHash); }

  if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', init); } else { init(); }
})();
</script>
