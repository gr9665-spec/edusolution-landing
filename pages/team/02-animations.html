<!-- 팀 에듀솔루션 페이지 | 스크롤 등장 + 부드러운 앵커 이동. 동작 줄이기 설정이면 움직임 없이 바로 보임 -->
<style>
@media (prefers-reduced-motion:no-preference){
  .pt-rv{opacity:0;transform:translateY(18px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1),box-shadow .3s;}
  .pt-rv.pt-in-view{opacity:1;transform:none;}
  .pt-mem-card.pt-rv.pt-in-view:hover{transform:translateY(-6px);}
}
</style>
<script>
(function(){
  function reveal(){
    if(!('IntersectionObserver' in window) || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(!e.isIntersecting) return;
        e.target.classList.add('pt-in-view');
        io.unobserve(e.target);
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });
    function reg(sel, step, mod){
      document.querySelectorAll(sel).forEach(function(el, i){
        el.classList.add('pt-rv');
        if(step) el.style.transitionDelay = ((i % mod) * step) + 's';
        io.observe(el);
      });
    }
    reg('.pt-h2'); reg('.pt-lead');
    reg('.pt-val-item', .1, 3);
    reg('.pt-yt-team');
    reg('.pt-mem-card', .1, 4);
    reg('.pt-cta h2'); reg('.pt-cta p'); reg('.pt-cta-btn');
  }

  function smoothAnchors(){
    document.querySelectorAll('a[href^="#"]').forEach(function(a){
      a.addEventListener('click', function(e){
        var target = document.querySelector(this.getAttribute('href'));
        if(!target) return;
        e.preventDefault();
        window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' });
      });
    });
  }

  function init(){ reveal(); smoothAnchors(); }
  if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', init); } else { init(); }
})();
</script>
